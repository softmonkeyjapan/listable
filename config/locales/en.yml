# The gem's validation messages, under its own top-level i18n namespace.
#
# The namespace is +listable+ and not +dry_validation+ so that these fifteen
# messages cannot collide with the messages a host writes for its own
# contracts: two gems answering to the same namespace would have the last one
# loaded silently rewording the other's refusals.
#
# A host overrides one message by loading a file of its own after this one —
# the railtie puts this file on the application's i18n load path, and i18n
# deep-merges what comes later over what came before, so an override names the
# single key it changes and inherits the fourteen others.
#
# Each message is a complete sentence rather than a clause completing the name
# of the key it hangs off. The listing endpoints that install this gem answer
# these strings straight to their clients, and a client reading a response
# reads the sentence alone, with no key beside it to complete.
en:
  listable:
    errors:
      "list?": "The filters must be a list of conditions."
      "hash?": "Each filter must be an object."
      too_many: "Too many filters: %{cap} at most."
      field_required: "The field is required."
      field_scalar: "The field must be a single value."
      field_unknown: "The field cannot be filtered on. Allowed fields: %{fields}."
      operator_required: "The operator is required."
      operator_scalar: "The operator must be a single value."
      operator_invalid: "The operator is not valid."
      value_required: "The value is required."
      value_scalar: "The value must be a single value."
      value_list: "The value must be a single value or a list of single values."
      "unknown_key?": "The key is not allowed."
      sort_scalar: "The sort must be a string."
      sort_unknown: "The listing cannot be sorted on this field. Allowed fields: %{fields}."
