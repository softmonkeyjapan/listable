# The Japanese half of the gem's closed message vocabulary. See +en.yml+ for
# why the messages live under the gem's own top-level i18n namespace and how a
# host overrides one of them.
ja:
  listable:
    errors:
      "list?": "フィルターは条件のリストである必要があります。"
      "hash?": "各フィルターはオブジェクトである必要があります。"
      too_many: "フィルターが多すぎます。最大%{cap}件です。"
      field_required: "フィールドは必須です。"
      field_scalar: "フィールドは単一の値である必要があります。"
      field_unknown: "このフィールドでは絞り込めません。使用できるフィールド: %{fields}。"
      operator_required: "演算子は必須です。"
      operator_scalar: "演算子は単一の値である必要があります。"
      operator_invalid: "演算子が無効です。"
      value_required: "値は必須です。"
      value_scalar: "値は単一の値である必要があります。"
      value_list: "値は単一の値または単一の値のリストである必要があります。"
      "unknown_key?": "キーは許可されていません。"
      sort_scalar: "並び替えは文字列である必要があります。"
      sort_unknown: "このフィールドでは並び替えできません。使用できるフィールド: %{fields}。"
